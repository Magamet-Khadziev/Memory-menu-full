<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEMORY | Меню кафе</title>

    <!-- Тема -->
    <meta name="theme-color" content="#241A14">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORY">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="MEMORY">

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK (с офлайн-кешем) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Контейнер приложения -->
    <div id="app"></div>

    <!-- Firebase конфигурация -->
    <script src="js/firebase-config.js"></script>

    <!-- Скрипты приложения -->
    <script src="js/storage.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker (для офлайн-работы) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log('✅ Service Worker зарегистрирован');
                        
                        // Проверяем обновления каждые 5 минут
                        setInterval(() => {
                            reg.update();
                        }, 5 * 60 * 1000);
                    })
                    .catch(err => console.log('❌ Ошибка Service Worker:', err));
            });
        }
    </script>
</body>
</html>
